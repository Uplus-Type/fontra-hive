<!doctype html>
<html class="dark-theme"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitation — Fontra Hive</title>
<link rel="icon" href="/hive/icons/hive-icon.png" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/hive/icons/apple-touch-icon.png">
<link rel="manifest" href="/hive/icons/site.webmanifest">
<link rel="stylesheet" href="/css/core.css">
<link rel="stylesheet" href="/hive/account/account.css">
<script type="module" src="/hive/account/account.js"></script>
<!-- The site's cookie notice (hive-api/deploy/site/static); a 404 where Hive is run without that site, harmless -->
<script src="/site/cookie-notice.js" defer></script>
</head>
<body data-page="invitation">
  <img class="logo" src="/hive/icons/hive-icon.png" alt="">
  <h1>You are invited</h1>
  <p class="lead">Checking the invitation…</p>
  <div id="invitation" class="hidden">
    <form id="accept" class="hidden">
      <p class="note as"></p>
      <div class="error"></div>
      <button type="submit">Accept the invitation</button>
    </form>
    <form id="signin" class="hidden">
      <p class="note">You already have an account: sign in to accept.</p>
      <label>Username or email <input name="login" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <div class="error"></div>
      <button type="submit">Sign in and accept</button>
      <a class="note" href="/forgot-password">Forgot your password?</a>
    </form>
    <form id="signup" class="hidden">
      <p class="note">Create your account for <b class="email"></b>.</p>
      <p class="note guest hidden">Your account will be <b>free</b>: you can look at and comment on what you are invited to.</p>
      <label>Username <small>letters, digits and hyphens; how others will find you</small>
        <input name="username" autocomplete="username" required maxlength="39" pattern="[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}"></label>
      <label>Your name <small>as shown to your team</small>
        <input name="fullname" autocomplete="name" maxlength="100"></label>
      <label>Password <small>at least 10 characters</small>
        <input name="password" type="password" autocomplete="new-password" required minlength="10"></label>
      <label>Password, again <input name="password2" type="password" autocomplete="new-password" required></label>
      <!-- Three boxes (U+ TYPE's lawyer, 21 October 2026): the terms of use,
           the privacy policy (read, not accepted), the age of digital
           consent in France. The terms of sale come with paying. -->
      <label class="check"><input name="terms" type="checkbox" required> <span>I have read and I accept the <a href="/terms#en" target="_blank" rel="noopener">terms of use</a>.</span></label>
      <label class="check"><input name="privacy" type="checkbox" required> <span>I have read the <a href="/privacy" target="_blank" rel="noopener">privacy policy</a>.</span></label>
      <label class="check"><input name="age" type="checkbox" required> <span>I certify that I am 15 or older.</span></label>
      <p class="note">How we treat your fonts: the <a href="/charter" target="_blank" rel="noopener">font charter</a>.</p>
      <div class="error"></div>
      <button type="submit">Create the account</button>
    </form>
  </div>
</body></html>
