<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Fontra Hive</title>
<link rel="stylesheet" href="/css/core.css">
<link rel="stylesheet" href="/hive/account/account.css">
<script type="module" src="/hive/account/account.js"></script>
</head>
<body data-page="login">
  <img class="logo" src="/images/fontra-icon.svg" alt="">
  <h1>Fontra Hive</h1>
  <p class="lead">Sign in to your projects.</p>
  <form id="login" class="hidden">
    <label>Username or email <input name="login" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <div class="error"></div>
    <button type="submit">Sign in</button>
  </form>
  <div class="links"><a href="/forgot-password">Forgot your password?</a></div>
  <p class="note" style="margin-top:2em">Hive is by invitation: ask someone on your team to invite you.</p>
</body></html>
