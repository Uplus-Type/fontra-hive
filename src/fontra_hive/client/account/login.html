<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fontra Hive — The Collaborative Font Editor</title>
<link rel="icon" href="/hive/icons/hive-icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/hive/icons/apple-touch-icon.png">
<link rel="manifest" href="/hive/icons/site.webmanifest">
<link rel="stylesheet" href="/css/core.css">
<link rel="stylesheet" href="/hive/account/account.css">
<script type="module" src="/hive/account/account.js"></script>
</head>
<body data-page="login">
  <img class="logo" src="/hive/icons/hive-icon.svg" alt="">
  <h1>Fontra Hive <span class="beta">Beta</span></h1>
  <p class="tagline">The Collaborative Font Editor</p>
  <p class="lead">Sign in to your projects.</p>
  <form id="login" class="hidden">
    <label>Username or email <input name="login" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <div class="error"></div>
    <button type="submit">Sign in</button>
  </form>
  <div class="links"><a href="/forgot-password">Forgot your password?</a></div>
  <div id="waitlist" class="waitlist">
    <p class="offer">Fontra Hive is a paid service on top of <a href="https://fontra.xyz">Fontra</a>, for type teams, from €9 per designer per month, reviewers free. Try it free for 21 days: during the beta, access is by invitation.</p>
    <button type="button" id="request-open" class="secondary">Request an invitation</button>
    <form id="request" class="hidden">
      <label>Email <input name="email" type="email" autocomplete="email" required maxlength="254"></label>
      <label>Name <small>optional</small> <input name="fullname" autocomplete="name" maxlength="100"></label>
      <label>Foundry or studio <small>optional</small> <input name="organization" autocomplete="organization" maxlength="100"></label>
      <label>What would you use Hive for? <small>optional</small> <textarea name="message" rows="3" maxlength="1000"></textarea></label>
      <label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>
      <div class="error"></div>
      <button type="submit">Send the request</button>
    </form>
    <div id="request-sent" class="card hidden"></div>
  </div>
</body></html>
