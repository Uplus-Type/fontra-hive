<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>New password — Fontra Hive</title>
<link rel="icon" href="/hive/icons/hive-icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/hive/icons/apple-touch-icon.png">
<link rel="manifest" href="/hive/icons/site.webmanifest">
<link rel="stylesheet" href="/css/core.css">
<link rel="stylesheet" href="/hive/account/account.css">
<script type="module" src="/hive/account/account.js"></script>
</head>
<body data-page="reset">
  <img class="logo" src="/hive/icons/hive-icon.svg" alt="">
  <h1>Choose a new password</h1>
  <p class="lead">You will be signed out everywhere else.</p>
  <form id="reset">
    <label>New password <small>at least 10 characters</small>
      <input name="password" type="password" autocomplete="new-password" required minlength="10"></label>
    <label>New password, again <input name="password2" type="password" autocomplete="new-password" required></label>
    <div class="error"></div>
    <button type="submit">Save and sign in</button>
  </form>
</body></html>
