<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — Fontra Hive</title>
<link rel="stylesheet" href="/css/core.css">
<link rel="stylesheet" href="/hive/account/account.css">
<script type="module" src="/hive/account/account.js"></script>
</head>
<body data-page="forgot">
  <img class="logo" src="/images/fontra-icon.svg" alt="">
  <h1>Forgot your password?</h1>
  <p class="lead">Give the email address of your account: we will send it a link to choose a new one.</p>
  <form id="forgot">
    <label>Email <input name="email" type="email" autocomplete="email" required></label>
    <div class="error"></div>
    <button type="submit">Send the link</button>
  </form>
  <div class="links"><a href="/">Back to sign in</a></div>
</body></html>
